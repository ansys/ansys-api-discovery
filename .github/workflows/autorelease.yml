name: Auto Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select the type of release"
        type: choice
        options:
        - patch
        - minor
        - major

concurrency:
  group: autorelease
  cancel-in-progress: false

permissions: {}

jobs:
  autorelease:
    name: "Auto release"
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create commits and push release tags to main branch
      pull-requests: write # required to create pull requests for version bump
    steps:
      - name: "Run hk-autorelease"
        id: autorelease
        uses: ansys/actions/hk-autorelease@5a91d7c2c4da2e86f2b3b62ba62daad189a6b77c # v11.2.0
        with:
          release-type: ${{ inputs.release_type }}
          version-source: "file"
          version-location: "ansys/api/discovery/VERSION"
          cherry-pick-commits: ""
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}
          bot-username: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          bot-email: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}

      - name: "Show outputs"
        env:
          NEW_VERSION: ${{ steps.autorelease.outputs.new-version }}
          NEW_DEV_VERSION: ${{ steps.autorelease.outputs.new-dev-version }}
          RELEASE_BRANCH: ${{ steps.autorelease.outputs.release-branch }}
          DEV_VERSION_PR_URL: ${{ steps.autorelease.outputs.dev-version-pr-url }}
        run: |
          {
            echo "### Auto release outputs"
            echo "- new-version: \`${NEW_VERSION}\`"
            echo "- new-dev-version: \`${NEW_DEV_VERSION}\`"
            echo "- release-branch: \`${RELEASE_BRANCH}\`"
            echo "- dev-version-pr-url: ${DEV_VERSION_PR_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
