syntax = "proto3";
package ansys.api.discovery.v1.ui.simulation.simulations;

import "ansys/api/discovery/v1/commonmessages.proto";
import "ansys/api/discovery/v1/physics/physicsmessages.proto";

option csharp_namespace = "Ansys.Api.Discovery.V1.UI.Simulation.Simulations";

service Simulations
{
  // Gets the current simulation.
  rpc GetCurrentSimulation(GetCurrentSimulationRequest) returns (GetCurrentSimulationResponse);

  // Sets a simulation as the current simulation.
  rpc SetCurrentSimulation(SetCurrentSimulationRequest) returns (SetCurrentSimulationResponse);
}

message GetCurrentSimulationRequest {
}

message GetCurrentSimulationResponse {
  // Unset when there is no current simulation.
  ansys.api.discovery.v1.physics.SimulationEntity simulation = 1;
}

message SetCurrentSimulationRequest {
  GuidEntityIdentifier simulation_id = 1;
}

message SetCurrentSimulationResponse {
  SetResponse set_response = 1;
}
