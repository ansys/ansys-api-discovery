  rpc SetIsVisible(SetIsVisibleRequest) returns (SetIsVisibleResponse);
  rpc GetIsEnabled(GetIsEnabledRequest) returns (GetIsEnabledResponse);
  rpc GetIsActive(GetIsActiveRequest) returns (GetIsActiveResponse);
  rpc GetSymbolSize(GetSymbolSizeRequest) returns (GetSymbolSizeResponse);
  rpc SetSymbolSize(SetSymbolSizeRequest) returns (SetSymbolSizeResponse);
  rpc GetCount(GetCountRequest) returns (GetCountResponse);
  rpc SetCount(SetCountRequest) returns (SetCountResponse);
  rpc GetEmissionRate(GetEmissionRateRequest) returns (GetEmissionRateResponse);
  rpc SetEmissionRate(SetEmissionRateRequest) returns (SetEmissionRateResponse);
  rpc GetEmissionRadius(GetEmissionRadiusRequest) returns (GetEmissionRadiusResponse);
