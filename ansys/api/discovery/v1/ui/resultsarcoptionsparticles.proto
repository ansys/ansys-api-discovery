  rpc GetAnimationSpeed(GetAnimationSpeedRequest) returns (GetAnimationSpeedResponse);
  rpc SetAnimationSpeed(SetAnimationSpeedRequest) returns (SetAnimationSpeedResponse);
  rpc GetRangeMin(GetRangeMinRequest) returns (GetRangeMinResponse);
  rpc SetRangeMin(SetRangeMinRequest) returns (SetRangeMinResponse);
  rpc GetRangeMax(GetRangeMaxRequest) returns (GetRangeMaxResponse);
  rpc SetRangeMax(SetRangeMaxRequest) returns (SetRangeMaxResponse);
  rpc GetColor(GetColorRequest) returns (GetColorResponse);
  rpc SetColor(SetColorRequest) returns (SetColorResponse);
  rpc GetEmitterControl(GetEmitterControlRequest) returns (GetEmitterControlResponse);
  rpc SetEmitterControl(SetEmitterControlRequest) returns (SetEmitterControlResponse);
  rpc GetIsPulsing(GetIsPulsingRequest) returns (GetIsPulsingResponse);
  rpc SetIsPulsing(SetIsPulsingRequest) returns (SetIsPulsingResponse);
  rpc GetEmitterPosition(GetEmitterPositionRequest) returns (GetEmitterPositionResponse);
  rpc SetEmitterPosition(SetEmitterPositionRequest) returns (SetEmitterPositionResponse);
  rpc ResetEmitter(ResetEmitterRequest) returns (ResetEmitterResponse);
}

