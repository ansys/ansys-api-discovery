syntax = "proto3";

package ansys.api.discovery.v1.physics.parameterization.designoptimization;

import "ansys/api/discovery/v1/commonmessages.proto";
import "ansys/api/discovery/v1/physics/physicsmessages.proto";

option csharp_namespace = "Ansys.Api.Discovery.V1.Physics.Parameterization.DesignOptimization";

// Design optimization service for defined-variation studies.
service DesignOptimization {
  // Gets all best-result variations from the latest optimization run.
  rpc GetOptimizationResults(GetOptimizationResultsRequest) returns (GetOptimizationResultsResponse);

  // Gets optimization input parameters.
  rpc GetInputParameters(GetInputParametersRequest) returns (GetInputParametersResponse);

  // Returns whether a parameter is currently configured as optimization input.
  rpc ContainsInputParameter(ContainsInputParameterRequest) returns (ContainsInputParameterResponse);

  // Adds a parameter to optimization inputs.
  rpc AddInputParameter(AddInputParameterRequest) returns (AddInputParameterResponse);

  // Removes a parameter from optimization inputs.
  rpc RemoveInputParameter(RemoveInputParameterRequest) returns (RemoveInputParameterResponse);

  // Sets the start range for an optimization input parameter.
  rpc SetInputStartRange(SetInputStartRangeRequest) returns (SetInputStartRangeResponse);

  // Sets the end range for an optimization input parameter.
  rpc SetInputEndRange(SetInputEndRangeRequest) returns (SetInputEndRangeResponse);

  // Restricts an optimization input parameter to integer-only values.
  rpc UseIntegerOnly(UseIntegerOnlyRequest) returns (UseIntegerOnlyResponse);

  // Updates maximum sample count.
  rpc UpdateOptimizationMaxSampleCount(UpdateOptimizationMaxSampleCountRequest) returns (UpdateOptimizationMaxSampleCountResponse);

  // Runs optimization.
  rpc RunDesignOptimization(RunDesignOptimizationRequest) returns (RunDesignOptimizationResponse);

  // Runs sensitivity analysis.
  rpc RunSensitivityAnalysis(RunSensitivityAnalysisRequest) returns (RunSensitivityAnalysisResponse);

  // Gets sensitivity summary data.
  rpc GetSensitivitySummary(GetSensitivitySummaryRequest) returns (GetSensitivitySummaryResponse);

  // Gets sensitivity value for an input/output pair.
  rpc GetSensitivityValue(GetSensitivityValueRequest) returns (GetSensitivityValueResponse);

  // Gets total CoP for an output row.
  rpc GetSensitivityTotalCoP(GetSensitivityTotalCoPRequest) returns (GetSensitivityTotalCoPResponse);

  // Gets configured optimization criteria.
  rpc GetOptimizationCriteria(GetOptimizationCriteriaRequest) returns (GetOptimizationCriteriaResponse);

  // Adds a parameter as optimization criteria.
  rpc AddOptimizationCriteria(AddOptimizationCriteriaRequest) returns (AddOptimizationCriteriaResponse);

  // Removes optimization criteria for a parameter.
  rpc RemoveOptimizationCriteria(RemoveOptimizationCriteriaRequest) returns (RemoveOptimizationCriteriaResponse);

  // Updates criteria type.
  rpc UpdateOptimizationCriteriaType(UpdateOptimizationCriteriaTypeRequest) returns (UpdateOptimizationCriteriaTypeResponse);

  // Updates objective operation.
  rpc UpdateObjectiveCriteriaOperation(UpdateObjectiveCriteriaOperationRequest) returns (UpdateObjectiveCriteriaOperationResponse);

  // Updates constraint operation.
  rpc UpdateConstraintCriteriaOperation(UpdateConstraintCriteriaOperationRequest) returns (UpdateConstraintCriteriaOperationResponse);

  // Updates constraint value.
  rpc UpdateOptimizationCriteriaValue(UpdateOptimizationCriteriaValueRequest) returns (UpdateOptimizationCriteriaValueResponse);

  // Generates sparse variations from configured optimization inputs.
  rpc GenerateVariations(GenerateVariationsRequest) returns (GenerateVariationsResponse);
}

enum OptimizationCriteriaType {
  OPTIMIZATION_CRITERIA_TYPE_UNSPECIFIED = 0;
  OPTIMIZATION_CRITERIA_TYPE_OBJECTIVE = 1;
  OPTIMIZATION_CRITERIA_TYPE_CONSTRAINT = 2;
}

enum OptimizationObjectiveCriteriaOperation {
  OPTIMIZATION_OBJECTIVE_CRITERIA_OPERATION_UNSPECIFIED = 0;
  OPTIMIZATION_OBJECTIVE_CRITERIA_OPERATION_MAXIMUM = 1;
  OPTIMIZATION_OBJECTIVE_CRITERIA_OPERATION_MINIMUM = 2;
}

enum OptimizationConstraintCriteriaOperation {
  OPTIMIZATION_CONSTRAINT_CRITERIA_OPERATION_UNSPECIFIED = 0;
  OPTIMIZATION_CONSTRAINT_CRITERIA_OPERATION_LESS_THAN_OR_EQUAL = 1;
  OPTIMIZATION_CONSTRAINT_CRITERIA_OPERATION_GREATER_THAN_OR_EQUAL = 2;
}

enum OptimizationSamplingAlgorithm {
  OPTIMIZATION_SAMPLING_ALGORITHM_UNSPECIFIED = 0;
  OPTIMIZATION_SAMPLING_ALGORITHM_LATIN_HYPER = 1;
}

message OptimizationParameter {
  GuidEntityIdentifier parameter_id = 1;
  string name = 2;
}

message OptimizationCriteriaItem {
  GuidEntityIdentifier criteria_id = 1;
  GuidEntityIdentifier parameter_id = 2;
  string parameter_name = 3;
  OptimizationCriteriaType criteria_type = 4;
  OptimizationObjectiveCriteriaOperation objective_operation = 5;
  OptimizationConstraintCriteriaOperation constraint_operation = 6;
  Quantity constraint_value = 7;
}

message OptimizationGeneratorInput {
  GuidEntityIdentifier parameter_id = 1;
  Quantity range_low = 2;
  Quantity range_high = 3;
  bool is_integer = 4;
}

message SensitivityOutputRow {
  GuidEntityIdentifier output_parameter_id = 1;
  string output_parameter_name = 2;
}

message GetOptimizationResultsRequest {
  GuidEntityIdentifier simulation_id = 1;
}

message GetOptimizationResultsResponse {
  repeated Variation optimization_results = 1;
}

message GetInputParametersRequest {
  GuidEntityIdentifier simulation_id = 1;
}

message GetInputParametersResponse {
  repeated OptimizationParameter input_parameters = 1;
}

message ContainsInputParameterRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
}

message ContainsInputParameterResponse {
  bool contains_input_parameter = 1;
}

message AddInputParameterRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
}

message AddInputParameterResponse {
  SetResponse set_response = 1;
}

message RemoveInputParameterRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
}

message RemoveInputParameterResponse {
  SetResponse set_response = 1;
}

message SetInputStartRangeRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
  Quantity value = 3;
}

message SetInputStartRangeResponse {
  SetResponse set_response = 1;
}

message SetInputEndRangeRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
  Quantity value = 3;
}

message SetInputEndRangeResponse {
  SetResponse set_response = 1;
}

message UseIntegerOnlyRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
  bool is_integer = 3;
}

message UseIntegerOnlyResponse {
  SetResponse set_response = 1;
}

message UpdateOptimizationMaxSampleCountRequest {
  GuidEntityIdentifier simulation_id = 1;
  int32 max_sample_count = 2;
}

message UpdateOptimizationMaxSampleCountResponse {
  SetResponse set_response = 1;
}

message RunDesignOptimizationRequest {
  GuidEntityIdentifier simulation_id = 1;
}

message RunDesignOptimizationResponse {
  CommandResponse command_response = 1;
}

message RunSensitivityAnalysisRequest {
  GuidEntityIdentifier simulation_id = 1;
}

message RunSensitivityAnalysisResponse {
  CommandResponse command_response = 1;
}

message GetSensitivitySummaryRequest {
  GuidEntityIdentifier simulation_id = 1;
}

message GetSensitivitySummaryResponse {
  bool has_sensitivity_results = 1;
  bool sensitivity_results_up_to_date = 2;
  repeated SensitivityOutputRow sensitivity_output_rows = 3;
}

message GetSensitivityValueRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier input_parameter_id = 2;
  GuidEntityIdentifier output_parameter_id = 3;
}

message GetSensitivityValueResponse {
  double value = 1;
}

message GetSensitivityTotalCoPRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier output_parameter_id = 2;
}

message GetSensitivityTotalCoPResponse {
  double total_cop = 1;
}

message GetOptimizationCriteriaRequest {
  GuidEntityIdentifier simulation_id = 1;
}

message GetOptimizationCriteriaResponse {
  repeated OptimizationCriteriaItem optimization_criteria = 1;
}

message AddOptimizationCriteriaRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
}

message AddOptimizationCriteriaResponse {
  SetResponse set_response = 1;
}

message RemoveOptimizationCriteriaRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier parameter_id = 2;
}

message RemoveOptimizationCriteriaResponse {
  SetResponse set_response = 1;
}

message UpdateOptimizationCriteriaTypeRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier criteria_id = 2;
  OptimizationCriteriaType criteria_type = 3;
}

message UpdateOptimizationCriteriaTypeResponse {
  SetResponse set_response = 1;
}

message UpdateObjectiveCriteriaOperationRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier criteria_id = 2;
  OptimizationObjectiveCriteriaOperation operation = 3;
}

message UpdateObjectiveCriteriaOperationResponse {
  SetResponse set_response = 1;
}

message UpdateConstraintCriteriaOperationRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier criteria_id = 2;
  OptimizationConstraintCriteriaOperation operation = 3;
}

message UpdateConstraintCriteriaOperationResponse {
  SetResponse set_response = 1;
}

message UpdateOptimizationCriteriaValueRequest {
  GuidEntityIdentifier simulation_id = 1;
  GuidEntityIdentifier criteria_id = 2;
  Quantity value = 3;
}

message UpdateOptimizationCriteriaValueResponse {
  SetResponse set_response = 1;
}

message GenerateVariationsRequest {
  GuidEntityIdentifier simulation_id = 1;
  int32 variation_count = 2;
  OptimizationSamplingAlgorithm algorithm = 3;
  GuidEntityIdentifier base_variation_id = 4;
  repeated OptimizationGeneratorInput inputs = 5;
}

message GenerateVariationsResponse {
  CommandResponse command_response = 1;
}
