syntax = "proto3";

package ansys.api.discovery.v1.commands.resultsexport;

import "ansys/api/discovery/v1/commonmessages.proto";
import "ansys/api/discovery/v1/resultenums.proto";

option csharp_namespace = "Ansys.Api.Discovery.V1.Commands.ResultsExport";

service ResultsExport {

  // Provides results for given points, a set of bodies or meshes and a result variable.
  rpc GetResultsForPoints(GetResultsForPointsRequest) 
	returns (GetResultsForPointsResponse);

  // Provides point cloud results for a set of bodies or meshes and a result variable.
  rpc GetPointCloudResults(GetPointCloudResultsRequest) 
	returns (GetPointCloudResultsResponse);

  // Exports Apollo results to an OpenVDB byte stream for the given result variables.
  rpc ExportResultsToOpenVDBMemory(ExportResultsToOpenVDBMemoryRequest) 
	returns (ExportResultsToOpenVDBMemoryResponse);

  // Exports Apollo results to an OpenVDB file for the given result variables
  // and streams back a zipped archive containing the exported file.
  rpc ExportResultsToOpenVDBFile(ExportResultsToOpenVDBFileRequest) 
	returns (stream ExportResultsToOpenVDBFileResponse);

  // Exports Apollo geometry grids to an OpenVDB byte stream.
  rpc ExportGeometryGridsToOpenVDBMemory(ExportGeometryGridsToOpenVDBMemoryRequest) 
	returns (ExportGeometryGridsToOpenVDBMemoryResponse);

  // Exports Apollo geometry grids to an OpenVDB file and streams back a zipped
  // archive containing the exported file.
  rpc ExportGeometryGridsToOpenVDBFile(ExportGeometryGridsToOpenVDBFileRequest) 
	returns (stream ExportGeometryGridsToOpenVDBFileResponse);

  // Exports USD results for optional bodies or meshes and result variables and
  // streams back a zipped archive containing the exported file.
  rpc ExportUSD(ExportUSDRequest) 
	returns (stream ExportUSDResponse);

  // Exports VTU results for optional bodies or meshes and result variables and
  // streams back a zipped archive containing the exported file.
  rpc ExportVTU(ExportVTURequest) 
	returns (stream ExportVTUResponse);
}

// Results on points

message GetResultsForPointsRequest {
  // Bodies and/or meshes for which the results are requested.
  repeated EntityIdentifier entity_ids = 1;
  // Points for which the results are requested.
  repeated Point points = 2;
  // Variable for which the results are requested.
  ResultVariable result_variable = 3;
  // For vector results only, the component for which the results are requested. If not set, all components are returned.
  optional ResultComponent vector_component = 4;
  // For tensor results only, the component for which the results are requested. If not set, defaults to XX.
  optional ResultComponent tensor_component = 5;
}

message GetResultsForPointsResponse {
  repeated float values = 1;
  int32 dimension = 2;
  CommandResponse command_response = 99;
}

// Point cloud results

message GetPointCloudResultsRequest {
  // Bodies and/or meshes for which the results are requested.
  repeated EntityIdentifier entity_ids = 1;
  // Variable for which the results are requested.
  ResultVariable result_variable = 2;
  // For vector results only, the component for which the results are requested. If not set, all components are returned.
  optional ResultComponent vector_component = 3;
  // For tensor results only, the component for which the results are requested. If not set, defaults to XX.
  optional ResultComponent tensor_component = 4;
}

message GetPointCloudResultsResponse {
  repeated float positions = 1;
  repeated float values = 2;
  int32 dimension = 3;
  CommandResponse command_response = 99;
}

// OpenVDB results export

message ExportResultsToOpenVDBMemoryRequest {
  repeated ResultVariable result_variables = 1;
}

message ExportResultsToOpenVDBMemoryResponse {
  bytes data = 1;
  CommandResponse command_response = 99;
}

message ExportResultsToOpenVDBFileRequest {
  // File name (with or without extension) to write on the server. The server
  // resolves the actual path inside its working directory.
  string file_name = 1;
  repeated ResultVariable result_variables = 2;
}

message ExportResultsToOpenVDBFileResponse {
  // Chunk of the zipped archive containing the exported file.
  bytes data = 1;
  CommandResponse command_response = 99;
}

// OpenVDB geometry grids export

message ExportGeometryGridsToOpenVDBMemoryRequest {
}

message ExportGeometryGridsToOpenVDBMemoryResponse {
  bytes data = 1;
  CommandResponse command_response = 99;
}

message ExportGeometryGridsToOpenVDBFileRequest {
  // File name (with or without extension) to write on the server. The server
  // resolves the actual path inside its working directory.
  string file_name = 1;
}

message ExportGeometryGridsToOpenVDBFileResponse {
  // Chunk of the zipped archive containing the exported file.
  bytes data = 1;
  CommandResponse command_response = 99;
}

// USD export

message ExportUSDRequest {
  // File name (with or without extension) to write on the server. The server
  // resolves the actual path inside its working directory.
  string file_name = 1;
  // Optional bodies and/or meshes for which the results are exported. If empty, the full model is exported.
  repeated EntityIdentifier entity_ids = 2;
  repeated ResultVariable result_variables = 3;
}

message ExportUSDResponse {
  // Chunk of the zipped archive containing the exported file.
  bytes data = 1;
  CommandResponse command_response = 99;
}

// VTU export

message ExportVTURequest {
  // File name (with or without extension) to write on the server. The server
  // resolves the actual path inside its working directory.
  string file_name = 1;
  // Optional bodies and/or meshes for which the results are exported. If empty, the full model is exported.
  repeated EntityIdentifier entity_ids = 2;
  repeated ResultVariable result_variables = 3;
}

message ExportVTUResponse {
  // Chunk of the zipped archive containing the exported file.
  bytes data = 1;
  CommandResponse command_response = 99;
}
