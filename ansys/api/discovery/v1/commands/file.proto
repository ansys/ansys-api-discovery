syntax = "proto3";
package ansys.api.discovery.v1.commands.file;

import "ansys/api/discovery/v1/commonenums.proto";
import "ansys/api/discovery/v1/commonmessages.proto";
import "ansys/api/discovery/v1/design/designdoc.proto";
import "ansys/api/discovery/v1/design/designmessages.proto";
import "google/protobuf/any.proto";

option csharp_namespace = "Ansys.Api.Discovery.V1.Commands.File";

service File{  

  rpc Close(CloseRequest)
    returns(CloseResponse);

  rpc GetReferencedDocuments(GetReferencedDocumentsRequest) 
    returns( stream GetReferencedDocumentsResponse);  

  rpc New(NewRequest)
    returns(NewResponse); 

  rpc Open(stream OpenRequest)
    returns (OpenResponse);
  
  rpc OpenFromUrl(OpenFromUrlRequest)
    returns(OpenFromUrlResponse);

  rpc Save(SaveRequest)
    returns (stream SaveResponse);    

  rpc SaveToUrl(SaveToUrlRequest)
  	returns (SaveToUrlResponse);

  rpc LoadAddin(stream LoadAddinRequest)
    returns (LoadAddinResponse);

  rpc RunAddinMethod(RunAddinMethodRequest)
    returns (RunAddinMethodResponse);

  rpc ExportTableToFile(ExportTableToFileRequest)
    returns (ExportTableToFileResponse);

  rpc SaveAsNewVersion(SaveAsNewVersionRequest)
    returns (SaveAsNewVersionResponse);

  rpc ExportExploreSolverDatabase(ExportExploreSolverDatabaseRequest)
    returns (ExportExploreSolverDatabaseResponse);

  rpc SaveImage(SaveImageRequest)
    returns (SaveImageResponse);

  rpc SaveAnimationFile(SaveAnimationFileRequest)
    returns (SaveAnimationFileResponse);

  rpc TransferToMechanical(TransferToMechanicalRequest)
    returns (TransferToMechanicalResponse);

  rpc TransferToFluent(TransferToFluentRequest)
    returns (TransferToFluentResponse);

  rpc TransferToHfss(TransferToHfssRequest)
    returns (TransferToHfssResponse);

  rpc TransferToIcepak(TransferToIcepakRequest)
    returns (TransferToIcepakResponse);

  rpc ImportHeatLoads(ImportHeatLoadsRequest)
    returns (ImportHeatLoadsResponse);

  rpc ExportTable(ExportTableRequest)
    returns (ExportTableResponse);
}

message CloseRequest{  
  EntityIdentifier design_id = 1;  
}  

message CloseResponse{
  CommandResponse command_response = 1;
}  

message GetReferencedDocumentsRequest {  
  EntityIdentifier document_id = 1;
}  

message GetReferencedDocumentsResponseData
{
  bytes data = 1;
  string original_file_path = 2;
}

message GetReferencedDocumentsResponse{
  repeated GetReferencedDocumentsResponseData response_data = 1;
  CommandResponse command_response = 2;
}

message SaveRequest{  
  FileFormat format = 1;
  SaveMode save_mode = 2;
  bool write_body_facets = 3;  
  optional EntityIdentifier parent_entity_id = 7; // this allows both part export and body export.
  string file_name = 4;
  optional ansys.api.discovery.v1.design.FMDExportOptions fmd_export_options = 8;
  optional ansys.api.discovery.v1.design.PMDBExportOptions pmdb_export_options = 9;
}  

message SaveResponse {  
  bytes data = 1;
  CommandResponse command_response = 2;
}

message SaveToUrlRequest{
  SaveMode save_mode = 1;
  bool write_body_facets = 2;
}  

message SaveToUrlResponse {  
  CommandResponse command_response = 1;
}

message NewRequest{  
  string name = 1;
}  

message NewResponse{  
  ansys.api.discovery.v1.design.designdoc.DesignDocEntity design = 1;
  CommandResponse command_response = 2;
}  

message OpenFromUrlRequest{  
  string url_filepath = 1;  
}  

message OpenFromUrlResponse{  
  ansys.api.discovery.v1.design.designdoc.DesignDocEntity design = 1;
  CommandResponse command_response = 2;
}  

message ImportOptionDefinition
{
  oneof option{
    bool bool_option = 1;
    string string_option =2;
  }
}

message OpenResponse{  
  ansys.api.discovery.v1.design.designdoc.DesignDocEntity design = 1;
  CommandResponse command_response = 2;
}   

message OpenRequest {
  bytes data = 1;
  string file_name = 2;
  OpenMode open_mode = 3;
  bool import_named_selections = 4;
  map<string,bool> import_options = 5;
  map<string, ImportOptionDefinition> import_options_definitions = 6;
}

message LoadAddinRequest {
  string manifest_name = 1;
  bytes data = 2;
}

message LoadAddinResponse {
  CommandResponse command_response = 1;
}

message RunAddinMethodRequest {
  string addin_name = 1;
  string method_name = 2;
  repeated google.protobuf.Any arguments = 3;
}

message RunAddinMethodResponse {
  google.protobuf.Any return_value = 1;
  CommandResponse command_response = 2;
}

message ExportTableToFileRequest {
  string file_path = 1;
  int32 table_index = 2;
  TableExportFormat table_export_format = 3;
  repeated string column_unit_values = 4;
}

message ExportTableToFileResponse {
  CommandResponse command_response = 1;
}

message SaveAsNewVersionRequest {
}

message SaveAsNewVersionResponse {
  CommandResponse command_response = 1;
}

message ExportExploreSolverDatabaseRequest {
  string file_path = 1;
}

message ExportExploreSolverDatabaseResponse {
  CommandResponse command_response = 1;
}

message SaveImageRequest {
  string file_path = 1;
  SaveImageKind save_image_kind = 2;
}

message SaveImageResponse {
  CommandResponse command_response = 1;
}

message SaveAnimationFileRequest {
  string file_path = 1;
  FileSolverType solver_type = 2;
}

message SaveAnimationFileResponse {
  CommandResponse command_response = 1;
}

message TransferToMechanicalRequest {
  string file_path = 1;
  TransferPhysics transfer_physics = 2;
}

message TransferToMechanicalResponse {
  CommandResponse command_response = 1;
}

message TransferToFluentRequest {
  string file_path = 1;
}

message TransferToFluentResponse {
  CommandResponse command_response = 1;
}

message TransferToHfssRequest {
  string file_path = 1;
}

message TransferToHfssResponse {
  CommandResponse command_response = 1;
}

message TransferToIcepakRequest {
  string file_path = 1;
  string file_filter = 2;
}

message TransferToIcepakResponse {
  CommandResponse command_response = 1;
}

message ImportHeatLoadsRequest {
  string file_path = 1;
  string delimiter = 2;
  Quantity quantity = 3;
}

message ImportHeatLoadsResponse {
  CommandResponse command_response = 1;
}

message ExportTableRequest {
  string file_path = 1;
  string delimiter = 2;
  Quantity quantity = 3;
  bool export_only_visible_bodies = 4;
}

message ExportTableResponse {
  CommandResponse command_response = 1;
}

enum OpenMode{
  OPENMODE_NEW = 0;
  OPENMODE_INSERT = 1;
}

enum SaveMode{
  SAVEMODE_STANDARD = 0;
  SAVEMODE_WITHOUT_RESULTS = 1;
}

enum TableExportFormat{
  TABLEEXPORTFORMAT_CSV = 0;
  TABLEEXPORTFORMAT_TSV = 1;
}

enum SaveImageKind {
  SAVEIMAGEKIND_2D = 0;
  SAVEIMAGEKIND_3D = 1;
}

enum FileSolverType {
  FILESOLVERTYPE_EXPLORE = 0;
  FILESOLVERTYPE_REFINE = 1;
}

enum TransferPhysics {
  TRANSFERPHYSICS_UNSPECIFIED = 0;
  TRANSFERPHYSICS_STRUCTURAL_ONLY = 1;
  TRANSFERPHYSICS_THERMAL_ONLY = 2;
  TRANSFERPHYSICS_LINKED_THERMAL_STRUCTURAL = 3;
}
